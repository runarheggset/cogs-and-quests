name: Publish to CurseForge

on:
  push:
    tags: ["v*"]   # release.published won't fire for GITHUB_TOKEN-created releases
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Export pack
        run: packwiz curseforge export
      - name: Upload to CurseForge
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::notice::CURSEFORGE_TOKEN secret / CURSEFORGE_PROJECT_ID variable not set - skipping publish."
            exit 0
          fi
          ZIP=$(ls *.zip | head -1)
          # resolve CurseForge's numeric IDs for 1.20.1 + Forge at runtime.
          # Names repeat across version-type groups, so filter by type:
          # '1.20.1' from a 'Minecraft 1.20' group, 'Forge' from 'Modloader'.
          export TYPES=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_TOKEN" https://minecraft.curseforge.com/api/game/version-types)
          VERSIONS=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_TOKEN" https://minecraft.curseforge.com/api/game/versions)
          export IDS=$(echo "$VERSIONS" | python3 -c "
          import json,sys,os
          types=json.loads(os.environ['TYPES'])
          mc={t['id'] for t in types if t['name'].startswith('Minecraft ')}
          ml={t['id'] for t in types if t['name']=='Modloader'}
          vs=json.load(sys.stdin)
          ids=[v['id'] for v in vs if (v['name']=='1.20.1' and v['gameVersionTypeID'] in mc)
                                   or (v['name']=='Forge'  and v['gameVersionTypeID'] in ml)]
          assert len(ids)==2, f'expected 2 ids, got {ids}'
          print(json.dumps(ids))")
          echo "resolved gameVersions: $IDS"
          METADATA=$(python3 -c "
          import json,os
          print(json.dumps({
            'changelog': 'See GitHub releases: https://github.com/${{ github.repository }}/releases',
            'changelogType': 'markdown',
            'releaseType': 'release',
            'gameVersions': json.loads(os.environ['IDS']),
          }))" )
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$METADATA" \
            -F "file=@$ZIP" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
